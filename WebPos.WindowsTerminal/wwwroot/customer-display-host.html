<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Customer Display — Smart POS</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="WebPos.WindowsTerminal.styles.css" />
    <style>
        html, body, #cfd-root {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #0f172a;
            font-family: Inter, "Segoe UI", sans-serif;
        }
    </style>
</head>
<body>
    <div id="cfd-root">Loading customer display…</div>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        (function () {
            window.__webPosCustomerNativeFs = null;

            window.webPosBindCustomerNativeFullscreen = function (netRef) {
                window.__webPosCustomerNativeFs = netRef || null;
            };

            window.webPosUnbindCustomerNativeFullscreen = function () {
                window.__webPosCustomerNativeFs = null;
            };

            window.addEventListener('keydown', function (e) {
                if (e.key !== 'F11' && e.code !== 'F11') {
                    return;
                }

                e.preventDefault();
                if (e.repeat || e.ctrlKey || e.altKey || e.metaKey) {
                    return;
                }

                if (!window.__webPosCustomerNativeFs) {
                    return;
                }

                try {
                    window.__webPosCustomerNativeFs.invokeMethodAsync('ToggleFullscreen');
                } catch (err) { /* ignore */ }
            }, true);
        })();
    </script>
</body>
</html>
