<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Smart POS</title>
    <base href="/" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="pos-menu.css" />
    <link rel="stylesheet" href="smart-pos.css" />
    <link rel="stylesheet" href="pos-subwindow.css" />
    <link rel="stylesheet" href="po-master.css" />
    <link rel="stylesheet" href="WebPos.WindowsTerminal.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        (function () {
            function sizeApp() {
                var root = document.documentElement;
                if (!root || root.style.getPropertyValue('--native-height')) {
                    return;
                }
                var h = Math.round(window.innerHeight || 0);
                if (window.visualViewport && window.visualViewport.height) {
                    h = Math.max(h, Math.round(window.visualViewport.height));
                }
                h = Math.max(h, root.clientHeight || 0);
                if (h > 0) {
                    root.style.setProperty('--app-height', h + 'px');
                }
            }

            function fullscreenElement() {
                return document.fullscreenElement
                    || document.webkitFullscreenElement
                    || document.msFullscreenElement
                    || null;
            }

            function requestFullscreen() {
                var el = document.documentElement;
                var req = el.requestFullscreen
                    || el.webkitRequestFullscreen
                    || el.webkitRequestFullScreen
                    || el.msRequestFullscreen;
                if (!req) {
                    return;
                }
                var result = req.call(el);
                if (result && typeof result.catch === 'function') {
                    result.catch(function () { /* ignore denied/unavailable */ });
                }
            }

            function exitFullscreen() {
                var exit = document.exitFullscreen
                    || document.webkitExitFullscreen
                    || document.webkitCancelFullScreen
                    || document.msExitFullscreen;
                if (!exit) {
                    return;
                }
                var result = exit.call(document);
                if (result && typeof result.catch === 'function') {
                    result.catch(function () { /* ignore */ });
                }
            }

            function toggleFullscreen() {
                if (window.__webPosNativeFs) {
                    try {
                        window.__webPosNativeFs.invokeMethodAsync('ToggleFullscreen');
                        return;
                    } catch (err) { /* fall through */ }
                }
                if (fullscreenElement()) {
                    exitFullscreen();
                } else {
                    requestFullscreen();
                }
            }

            sizeApp();
            window.addEventListener('resize', sizeApp);
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', sizeApp);
            }
            document.addEventListener('fullscreenchange', sizeApp);
            document.addEventListener('webkitfullscreenchange', sizeApp);
            document.addEventListener('MSFullscreenChange', sizeApp);

            function primaryField() {
                var scan = document.getElementById('scanInput') || document.getElementById('searchInput');
                if (scan && !scan.disabled && scan.getAttribute('aria-hidden') !== 'true') {
                    return scan;
                }
                if (document.querySelector('.auth-shell .keypad')) {
                    var pin = document.getElementById('pin');
                    if (pin && !pin.disabled) {
                        return pin;
                    }
                }
                return null;
            }

            function focusPrimary() {
                // Modal open: restore the dialog keyboard target, never steal to scanInput.
                var backdrop = document.querySelector('.modal-backdrop');
                if (backdrop) {
                    var dialog = backdrop.querySelector('[role="dialog"][tabindex], [role="dialog"]');
                    if (dialog instanceof HTMLElement) {
                        var activeInDialog = dialog === document.activeElement
                            || dialog.contains(document.activeElement);
                        if (!activeInDialog) {
                            try {
                                dialog.focus({ preventScroll: true });
                            } catch (err) { /* ignore */ }
                        }
                    }
                    return;
                }

                var active = document.activeElement;
                // Preserve intentional editing of qty/price/discount/etc.
                if (active instanceof Element
                    && active.id !== 'scanInput'
                    && active.id !== 'searchInput'
                    && isProtectedTypingTarget(active)) {
                    return;
                }

                var el = primaryField();
                if (!el) {
                    return;
                }
                try {
                    el.focus({ preventScroll: true });
                    if (el.id === 'scanInput' && typeof el.select === 'function') {
                        el.select();
                    }
                } catch (err) { /* ignore */ }
            }

            window.webPosFocusPrimary = focusPrimary;

            window.webPosConsumeInitialScanFocus = function () {
                try {
                    if (sessionStorage.getItem('webPosSalesInitialFocusDone') === '1') {
                        return false;
                    }
                    sessionStorage.setItem('webPosSalesInitialFocusDone', '1');
                    return true;
                } catch (err) {
                    if (window.__webPosSalesInitialFocusDone) {
                        return false;
                    }
                    window.__webPosSalesInitialFocusDone = true;
                    return true;
                }
            };

            window.webPosAllowNextScanFocus = function () {
                try {
                    sessionStorage.removeItem('webPosSalesInitialFocusDone');
                } catch (err) { /* ignore */ }
                window.__webPosSalesInitialFocusDone = false;
            };

            function isInteractive(el) {
                if (!(el instanceof Element)) {
                    return false;
                }
                return !!el.closest(
                    'a,button,input,textarea,select,option,label,summary,' +
                    '[role="button"],[role="menuitem"],[role="option"],[role="dialog"],[role="listbox"],' +
                    '[contenteditable="true"],.modal-backdrop,.pos-menu-flyout,.sf-scan-dropdown,' +
                    '.pos-menu-link,.pos-flyout-item,.key,.sp-action-btn,.sp-save,.sp-customer-input,' +
                    '.sf-cell-input,.channel-pill,.sp-pay-link,.sp-switch,.auth-submit'
                );
            }

            function isProtectedTypingTarget(el) {
                if (!(el instanceof Element)) {
                    return false;
                }
                if (el.closest(
                    '.modal-backdrop,[role="dialog"],[role="menu"],[role="listbox"],' +
                    '.pos-menu-flyout,.sf-scan-dropdown,.auth-shell'
                )) {
                    return true;
                }
                var tag = (el.tagName || '').toLowerCase();
                if (tag === 'input' || tag === 'textarea' || tag === 'select' || tag === 'option') {
                    return true;
                }
                if (el.isContentEditable || el.getAttribute('contenteditable') === 'true') {
                    return true;
                }
                return !!el.closest(
                    'input,textarea,select,[contenteditable="true"],' +
                    '.sf-cell-input,.cell-editor,.sp-items-table input'
                );
            }

            function appendCharToSearch(el, ch) {
                el.focus({ preventScroll: true });
                var start = typeof el.selectionStart === 'number' ? el.selectionStart : el.value.length;
                var end = typeof el.selectionEnd === 'number' ? el.selectionEnd : el.value.length;
                el.value = el.value.slice(0, start) + ch + el.value.slice(end);
                var pos = start + ch.length;
                try {
                    el.setSelectionRange(pos, pos);
                } catch (err) { /* ignore */ }
                try {
                    el.dispatchEvent(new InputEvent('input', {
                        bubbles: true,
                        cancelable: true,
                        data: ch,
                        inputType: 'insertText'
                    }));
                } catch (err) {
                    el.dispatchEvent(new Event('input', { bubbles: true }));
                }
            }

            function rememberCaret() {
                var el = document.activeElement;
                if (!(el instanceof HTMLInputElement) && !(el instanceof HTMLTextAreaElement)) {
                    return;
                }
                if (!el.id) {
                    return;
                }
                if (el.id !== 'scanInput' && !el.classList.contains('sf-cell-input')) {
                    return;
                }
                try {
                    sessionStorage.setItem('webPosCaret', JSON.stringify({
                        id: el.id,
                        start: el.selectionStart || 0,
                        end: el.selectionEnd || 0
                    }));
                } catch (err) { /* ignore */ }
            }

            window.webPosRestoreCaret = function (fallbackId) {
                try {
                    var raw = sessionStorage.getItem('webPosCaret');
                    var caret = raw ? JSON.parse(raw) : null;
                    var id = (caret && caret.id) || fallbackId;
                    var el = id ? document.getElementById(id) : null;
                    if (!el || el.disabled) {
                        return false;
                    }
                    el.focus({ preventScroll: true });
                    if (caret && typeof el.setSelectionRange === 'function') {
                        var start = caret.start || 0;
                        var end = caret.end || start;
                        el.setSelectionRange(start, end);
                    }
                    return document.activeElement === el;
                } catch (err) {
                    return false;
                }
            };

            document.addEventListener('selectionchange', rememberCaret);
            document.addEventListener('keyup', rememberCaret, true);

            document.addEventListener('click', function (e) {
                if (isInteractive(e.target)) {
                    return;
                }
                focusPrimary();
            }, false);

            window.addEventListener('keydown', function (e) {
                if (e.key === 'F11' || e.code === 'F11') {
                    e.preventDefault();
                    if (e.repeat || e.ctrlKey || e.altKey || e.metaKey) {
                        return;
                    }
                    toggleFullscreen();
                    return;
                }

                if (e.key && /^F([1-9]|1[0-2])$/.test(e.key)) {
                    e.preventDefault();
                }

                if (e.key === 'Backspace'
                    && !e.ctrlKey && !e.altKey && !e.metaKey
                    && !document.querySelector('.auth-shell .keypad')
                    && !isProtectedTypingTarget(document.activeElement)) {
                    e.preventDefault();
                }

                if (e.ctrlKey || e.altKey || e.metaKey || !e.key || e.key.length !== 1) {
                    return;
                }
                if (!/^[a-zA-Z0-9]$/.test(e.key)) {
                    return;
                }

                // Global barcode buffer owns wedge routing when active.
                if (window.webPosBarcodeScanner && typeof window.webPosBarcodeScanner.isActive === 'function'
                    && window.webPosBarcodeScanner.isActive()) {
                    return;
                }

                var scan = document.getElementById('scanInput');
                if (!scan || scan.disabled || scan.getAttribute('aria-hidden') === 'true') {
                    return;
                }
                if (document.querySelector('.modal-backdrop, .auth-shell .keypad')) {
                    return;
                }
                if (document.activeElement === scan || isProtectedTypingTarget(document.activeElement)) {
                    return;
                }

                e.preventDefault();
                e.stopPropagation();
                appendCharToSearch(scan, e.key);
                rememberCaret();
            }, true);
        })();
        window.webPosWatchTableRows = function (el, netRef) {
            if (!el || !netRef) {
                return;
            }
            var header = 37;
            var minRow = 28;
            function report() {
                var n = Math.floor((el.clientHeight - header) / minRow);
                if (!isFinite(n) || n < 12) {
                    n = 12;
                }
                if (n > 24) {
                    n = 24;
                }
                netRef.invokeMethodAsync('OnTableSlotCount', n);
            }
            if (el.__rowWatch) {
                el.__rowWatch.disconnect();
            }
            el.__rowWatch = new ResizeObserver(report);
            el.__rowWatch.observe(el);
            report();

            if (!el.__webPosScrollBound) {
                el.__webPosScrollBound = true;
                try {
                    var saved = sessionStorage.getItem('webPosTableScroll');
                    if (saved) {
                        el.scrollTop = parseInt(saved, 10) || 0;
                    }
                } catch (err) { /* ignore */ }
                el.addEventListener('scroll', function () {
                    try {
                        sessionStorage.setItem('webPosTableScroll', String(el.scrollTop || 0));
                    } catch (err) { /* ignore */ }
                }, { passive: true });
            }
        };

        window.webPosResetTableScroll = function () {
            try {
                sessionStorage.setItem('webPosTableScroll', '0');
            } catch (err) { /* ignore */ }
            var el = document.querySelector('.sp-table-scroll');
            if (el) {
                el.scrollTop = 0;
            }
        };

        window.webPosSetScrollTop = function (el, top) {
            if (!el) {
                return;
            }
            el.scrollTop = top || 0;
        };
        window.webPosFlashLine = function (id) {
            if (!id) {
                return;
            }
            var row = document.querySelector('tr[data-line-id="' + id + '"]');
            if (!row) {
                return;
            }
            row.classList.remove('item-added');
            void row.offsetWidth;
            row.classList.add('item-added');
            row.addEventListener('animationend', function handler() {
                row.classList.remove('item-added');
                row.removeEventListener('animationend', handler);
            });
        };
        window.webPosPreventKeys = function (el, keys) {
            if (!el) {
                return;
            }
            // Allow re-bind when Blazor replaces the input node.
            if (el.__webPosPreventKeys) {
                return;
            }
            el.__webPosPreventKeys = true;
            var set = new Set(keys || []);
            el.addEventListener('keydown', function (e) {
                if (set.has(e.key)) {
                    e.preventDefault();
                }
            }, true);
        };

        window.webPosSelectInput = function (el) {
            if (!el) {
                return;
            }
            el.focus();
            if (typeof el.select === 'function') {
                el.select();
            }
        };

        window.webPosFocusById = function (id) {
            if (!id) {
                return false;
            }
            var el = document.getElementById(id);
            if (!el || el.disabled) {
                return false;
            }
            el.focus();
            if (typeof el.select === 'function') {
                el.select();
            }
            return document.activeElement === el;
        };

        window.webPosBindNativeFullscreen = function (netRef) {
            window.__webPosNativeFs = netRef || null;
        };

        window.webPosUnbindNativeFullscreen = function () {
            window.__webPosNativeFs = null;
        };

        window.webPosBindCtrlK = function () {
            window.webPosBindPosShortcuts();
        };

        window.webPosBindSaveKeys = function () {
            window.webPosBindPosShortcuts();
        };

        window.webPosBindPosShortcuts = function () {
            if (window.__webPosPosShortcutsBound) {
                return;
            }
            window.__webPosPosShortcutsBound = true;

            function focusScanner() {
                var el = document.getElementById('scanInput');
                if (el && !el.disabled) {
                    el.focus({ preventScroll: true });
                    if (typeof el.select === 'function') {
                        el.select();
                    }
                }
            }

            function pressSaveButton() {
                var btn = document.getElementById('saveInvoiceButton');
                if (!btn) {
                    btn = document.querySelector('.sp-save');
                }
                if (!btn || btn.disabled) {
                    return;
                }
                btn.classList.add('is-pressed');
                window.setTimeout(function () {
                    btn.classList.remove('is-pressed');
                }, 150);
                btn.click();
            }

            window.addEventListener('keydown', function (e) {
                if ((e.ctrlKey || e.metaKey) && (e.code === 'KeyK' || (e.key && e.key.toLowerCase() === 'k'))) {
                    if (document.querySelector('.modal-backdrop')) {
                        return;
                    }
                    e.preventDefault();
                    e.stopPropagation();
                    focusScanner();
                    return;
                }

                var isSaveShortcut =
                    e.key === 'F12' ||
                    e.key === 'Insert' ||
                    e.code === 'Insert' ||
                    ((e.ctrlKey || e.metaKey) && (e.key === 'Enter' || e.code === 'Enter' || e.code === 'NumpadEnter'));

                var fkey = e.key && e.key.match(/^F([1-9])$/);
                var modalOpen = !!document.querySelector('.modal-backdrop');

                if (isSaveShortcut) {
                    e.preventDefault();
                    if (modalOpen || e.repeat) {
                        return;
                    }
                    e.stopPropagation();
                    pressSaveButton();
                    return;
                }

                if (fkey) {
                    e.preventDefault();
                    if (e.repeat) {
                        return;
                    }
                    e.stopPropagation();
                    var action = document.querySelector('[data-pos-fkey="F' + fkey[1] + '"]');
                    if (action && !action.disabled && !modalOpen) {
                        action.classList.add('is-pressed');
                        window.setTimeout(function () {
                            action.classList.remove('is-pressed');
                        }, 150);
                        action.click();
                    }
                }
            }, true);
        };

        window.webPosBindCellKeys = function () {
            if (window.__webPosCellKeysBound) {
                return;
            }
            window.__webPosCellKeysBound = true;
            window.addEventListener('keydown', function (e) {
                var t = e.target;
                if (!t || !t.classList || !t.classList.contains('sf-cell-input')) {
                    return;
                }
                if (e.key === 'Tab' || e.key === 'Enter' || e.key === 'ArrowUp' || e.key === 'ArrowDown'
                    || e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'F12' || e.key === 'Insert') {
                    e.preventDefault();
                    return;
                }
                if (e.key === 'Delete' && !e.shiftKey && !e.ctrlKey && !e.altKey && !e.metaKey) {
                    e.preventDefault();
                }
            }, true);
        };

        window.webPosSelectById = function (id) {
            if (!id) {
                return;
            }
            var el = document.getElementById(id);
            if (!el || el.disabled) {
                return;
            }
            requestAnimationFrame(function () {
                try {
                    if (typeof el.select === 'function') {
                        el.select();
                    }
                } catch (err) { /* ignore */ }
            });
        };

        window.webPosBindPinPad = function (netRef) {
            window.__webPosPinPadRef = netRef || null;
            if (window.__webPosPinPadBound) {
                return;
            }
            window.__webPosPinPadBound = true;
            window.addEventListener('keydown', function (e) {
                if (!document.querySelector('.auth-shell .keypad')) {
                    return;
                }
                if (e.ctrlKey || e.altKey || e.metaKey) {
                    return;
                }

                var payload = null;
                if (e.key && e.key.length === 1 && e.key >= '0' && e.key <= '9') {
                    payload = e.key;
                } else if (e.key === 'Backspace') {
                    payload = 'backspace';
                } else if (e.key === 'Escape' || e.key === 'Delete') {
                    payload = 'clear';
                } else if (e.key === 'Enter' || e.code === 'Enter' || e.code === 'NumpadEnter') {
                    payload = 'enter';
                } else {
                    return;
                }

                e.preventDefault();
                e.stopPropagation();
                if (e.repeat && payload !== 'backspace') {
                    return;
                }

                var btn = document.querySelector('.auth-shell [data-pin-key="' + payload + '"]');
                if (btn) {
                    btn.classList.add('is-pressed', 'active');
                    window.setTimeout(function () {
                        btn.classList.remove('is-pressed', 'active');
                    }, 150);
                }

                var ref = window.__webPosPinPadRef;
                if (ref) {
                    ref.invokeMethodAsync('OnPhysicalPinKey', payload);
                }
            }, true);
        };

        window.webPosUnbindPinPad = function () {
            window.__webPosPinPadRef = null;
        };

        window.webPosPressSave = function () {
            var el = document.querySelector('.sp-save');
            if (!el) {
                return;
            }
            el.classList.add('is-pressed');
            setTimeout(function () {
                el.classList.remove('is-pressed');
            }, 150);
        };

        window.webPosPrintReceipt = function (text) {
            var html = '<!DOCTYPE html><html><head><title>Receipt</title>'
                + '<style>body{font-family:Consolas,monospace;font-size:12pt;padding:12px;white-space:pre-wrap;}</style>'
                + '</head><body></body></html>';
            var w = window.open('', '_blank', 'width=420,height=640');
            if (!w) {
                throw new Error('Popup blocked');
            }
            w.document.open();
            w.document.write(html);
            w.document.close();
            w.document.body.textContent = text || '';
            setTimeout(function () {
                w.focus();
                w.print();
            }, 200);
        };

        window.webPosBindPosShortcuts();
        window.webPosBindPinPad(null);
    </script>
    <script src="js/barcode-scanner.js"></script>

</body>

</html>
