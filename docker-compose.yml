services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: webpos_db
    ports:
      - "5432:5432"
    volumes:
      - webpos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webpos_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Development + AllowInsecureDevDefaults → auto JWT/PIN/RSA if .env secrets are missing
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      DisableHttpsRedirection: "true"
      Security__AllowInsecureDevDefaults: "true"
      DataProtection__KeysPath: /app/dp-keys
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=webpos_db;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Security__PinHashKey: ${SECURITY_PIN_HASH_KEY:-}
      Security__Jwt__Key: ${SECURITY_JWT_KEY:?Set SECURITY_JWT_KEY in .env (min 32 chars)}
      Security__Enrollment__PrivateKeyPem: ${SECURITY_ENROLLMENT_PRIVATE_KEY_PEM:-}
      Security__Enrollment__PublicKeyPem: ${SECURITY_ENROLLMENT_PUBLIC_KEY_PEM:-}
      Pilot__TerminalId: ${PILOT_TERMINAL_ID:-00000000-0000-0000-0000-000000000010}
      Pilot__OwnerPassword: ${PILOT_OWNER_PASSWORD:?Set PILOT_OWNER_PASSWORD in .env}
      Pilot__AdminPassword: ${PILOT_ADMIN_PASSWORD:?Set PILOT_ADMIN_PASSWORD in .env}
      Pilot__OwnerPin: ${PILOT_OWNER_PIN:?Set PILOT_OWNER_PIN in .env}
      Pilot__ManagerPin: ${PILOT_MANAGER_PIN:?Set PILOT_MANAGER_PIN in .env}
      Pilot__CashierPin: ${PILOT_CASHIER_PIN:?Set PILOT_CASHIER_PIN in .env}
      Pilot__AbcCashierPin: ${PILOT_ABC_CASHIER_PIN:?Set PILOT_ABC_CASHIER_PIN in .env}
    volumes:
      - webpos_dpkeys:/app/dp-keys
      # Persist generated enrollment RSA keys across container rebuilds (gitignored)
      - ./WebPos/dev-secrets:/app/dev-secrets
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  webpos_pgdata:
  webpos_dpkeys:
